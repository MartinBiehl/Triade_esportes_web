<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F8FA">
  <title>Sem internet · Triade Esporte</title>
  <!-- Tela 29 · Sem internet. Página estática (sem PHP) que o sw.js guarda para mostrar sem conexão. -->
  <style>
    @font-face { font-family: "Inter"; src: url("assets/fonts/inter-variavel.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    :root { --marca: #0052FF; --texto: #07090D; --texto-2: #5B6272; --fundo: #F8F8FA; }
    * { box-sizing: border-box; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      min-height: 100vh; min-height: 100dvh; margin: 0; padding: 24px; text-align: center;
      font-family: "Inter", system-ui, sans-serif; color: var(--texto); background: var(--fundo);
      -webkit-font-smoothing: antialiased;
    }
    .icone { display: grid; place-items: center; width: 88px; height: 88px; margin-bottom: 8px; border-radius: 999px; background: #F1F2F5; color: var(--texto-2); }
    .icone svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    h1 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.012em; }
    p { max-width: 30ch; margin: 0; font-size: 15px; line-height: 22px; color: var(--texto-2); }
    button {
      height: 52px; margin-top: 16px; padding: 0 32px; border: 0; border-radius: 999px;
      font: inherit; font-size: 17px; font-weight: 600; color: #fff; background: var(--marca); cursor: pointer;
      box-shadow: 0 8px 24px rgb(0 82 255 / 0.3); transition: transform 120ms ease-out;
    }
    button:active { transform: scale(0.97); }
    small { margin-top: 8px; font-size: 13px; color: var(--texto-2); }
  </style>
</head>
<body>
<main style="display: contents">
  <div class="icone" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 7 0M5 12.8a10 10 0 0 1 4.2-2.4M19 12.8a10 10 0 0 0-2.2-1.6M2 9a15 15 0 0 1 4.3-2.7M22 9a15 15 0 0 0-11-3.9"/><path d="M12 20h.01"/></svg>
  </div>
  <h1>Sem internet</h1>
  <p>Confira o Wi-Fi ou os dados móveis. Sua sacola continua salva.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
  <small>A página volta sozinha quando a conexão voltar.</small>
</main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
